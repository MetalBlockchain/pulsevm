[package]
name = "pulsevm"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["spdlog-rs"] # The package exports the `spdlog` crate name.

[dependencies]
anyhow = "1.0.98"
hex = "0.4"
futures-util = "0.3"
jsonrpsee = { version = "0.26", features = ["server", "macros"] }
spdlog-rs = "0.5.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-tungstenite = "0.21"
tungstenite = { version = "0.21" }
tokio-util = { version = "0.7.16" }
tonic = "0.14.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }

pulsevm_core = { path = "../pulsevm_core" }
pulsevm_crypto = { path = "../pulsevm_crypto" }
pulsevm_grpc = { path = "../pulsevm_grpc" }
pulsevm_proc_macros = { path = "../pulsevm_proc_macros" }
pulsevm_serialization = { path = "../pulsevm_serialization" }

[features]
default = []
# Compile the unfinished protocol implementations exposed by pulsevm_core.
# Runtime activation remains controlled by the chain upgrade schedule.
nightly = ["pulsevm_core/nightly"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
tempfile = "3"

[[bench]]
name = "admission_contention"
harness = false
