[package]
name = "pulsevm_core"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["spdlog-rs"] # The package exports the `spdlog` crate name.

[dependencies]
base64 = "0.22.1"
chrono = "0.4.40"
flate2 = "1.1.2"
hex = "0.4"
lru = "0.18.4"
ripemd = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["asm"] }
spdlog-rs = "0.5.3"
tempfile = "3.23.0"
thiserror = "2"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
wasmer = { version = "7.4.0", features = ["llvm"] }
wasmer-compiler-llvm = "7.4.0"
wasmer-middlewares = "7.4.0"
wat = "1"

pulsevm_billable_size = { path = "../pulsevm_billable_size" }
pulsevm_constants = { path = "../pulsevm_constants" }
pulsevm_crypto = { path = "../pulsevm_crypto" }
pulsevm_error = { path = "../pulsevm_error" }
pulsevm_grpc = { path = "../pulsevm_grpc" }
pulsevm_name = { path = "../pulsevm_name" }
pulsevm_name_macro = { path = "../pulsevm_name_macro" }
pulsevm_proc_macros = { path = "../pulsevm_proc_macros" }
pulsevm_serialization = { path = "../pulsevm_serialization" }
pulsevm_softfloat = { path = "../pulsevm_softfloat" }
pulsevm_database = { path = "../pulsevm_database" }
pulsevm_wasm_validation = { path = "../pulsevm_wasm_validation" }

[features]
default = []
# Aggregate every unfinished `protocol_feature_*` flag here. This controls
# which implementations are compiled; the chain schedule still controls when
# compiled behavior activates.
nightly = []
arena-shadow = []
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1"
# Signing the same digest twice with different nonce data, to build a
# transaction whose signatures are distinct but recover the same key.
secp256k1 = { version = "0.30", features = ["recovery", "global-context"] }
p256 = { version = "0.13", features = ["ecdsa"] }

[[bench]]
name = "transfer"
harness = false

[[bench]]
name = "mempool_pruning"
harness = false
