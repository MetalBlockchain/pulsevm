[package]
name = "pulsevm_ffi"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
cxx = "1.0.194"
hex = "0.4"
tempfile = "3.23.0"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
serde = { version = "1.0", features = ["derive"] }
pulsevm_billable_size = { path = "../pulsevm_billable_size" }
pulsevm_constants = { path = "../pulsevm_constants" }
pulsevm_crypto = { path = "../pulsevm_crypto" }
pulsevm_error = { path = "../pulsevm_error" }
pulsevm_name = { path = "../pulsevm_name" }
pulsevm_proc_macros = { path = "../pulsevm_proc_macros" }
pulsevm_serialization = { path = "../pulsevm_serialization" }
prost-types = "0.12.3"
serde_json = "1.0"
zerocopy = "0.8.34"
zerocopy-derive = "0.8.34"
# Only pulled in for the arena-shadow differential-testing build.
pulsevm_arena = { path = "../pulsevm_arena", optional = true }
pulsevm_chaindb = { path = "../pulsevm_chaindb", optional = true }

[features]
# Mirrors ported state mutations into a native pulsevm_arena Db carried inside
# Database, so a per-block arena state root can be checked against chainbase.
arena-shadow = ["dep:pulsevm_arena", "dep:pulsevm_chaindb"]

[build-dependencies]
cc = "1.2.50"
cxx-build = { version = "1.0" }
cmake = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
pulsevm_contractdb = { path = "../pulsevm_contractdb" }
proptest = "1"

[[bench]]
name = "read"
harness = false

[[bench]]
name = "insert"
harness = false
[[bench]]
name = "session"
harness = false
