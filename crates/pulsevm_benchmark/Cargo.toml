[package]
name = "pulsevm_benchmark"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["spdlog-rs"] # The package exports the `spdlog` crate name.

[dependencies]
chrono = "0.4.40"
serde_json = "1.0"
spdlog-rs = "0.5.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

pulsevm_core = { path = "../pulsevm_core" }
pulsevm_proc_macros = { path = "../pulsevm_proc_macros" }
pulsevm_serialization = { path = "../pulsevm_serialization" }
