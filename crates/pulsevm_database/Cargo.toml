[package]
name = "pulsevm_database"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
hex = "0.4"
tempfile = "3.23.0"
time = { version = "0.3.41", features = ["formatting", "macros", "parsing"] }
serde = { version = "1.0", features = ["derive"] }
pulsevm_abi = { path = "../pulsevm_abi" }
pulsevm_billable_size = { path = "../pulsevm_billable_size" }
pulsevm_chain_types = { path = "../pulsevm_chain_types" }
pulsevm_rpc = { path = "../pulsevm_rpc" }
pulsevm_constants = { path = "../pulsevm_constants" }
pulsevm_crypto = { path = "../pulsevm_crypto" }
pulsevm_error = { path = "../pulsevm_error" }
pulsevm_name = { path = "../pulsevm_name" }
pulsevm_proc_macros = { path = "../pulsevm_proc_macros" }
pulsevm_serialization = { path = "../pulsevm_serialization" }
prost-types = "0.12.3"
serde_json = "1.0"
pulsevm_arena = { path = "../pulsevm_arena" }
pulsevm_chaindb = { path = "../pulsevm_chaindb" }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
pulsevm_contractdb = { path = "../pulsevm_contractdb" }
pulsevm_softfloat = { path = "../pulsevm_softfloat" }
proptest = "1"
secp256k1 = { version = "0.30", features = ["rand"] }

[[bench]]
name = "read"
harness = false

[[bench]]
name = "insert"
harness = false
[[bench]]
name = "session"
harness = false
