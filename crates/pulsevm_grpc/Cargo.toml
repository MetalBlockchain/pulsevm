[package]
name = "pulsevm_grpc"
version = "0.1.0"
edition = "2024"

[package.metadata.cargo-machete]
# `tonic::include_proto!` expands to references to these generated-code crates.
ignored = ["prost", "prost-types", "tonic-prost"]

[dependencies]
tonic = "0.14.6"
tonic-prost = "0.14.6"
prost = "0.14"
prost-types = "0.14"

[build-dependencies]
tonic-prost-build = "0.14.6"
