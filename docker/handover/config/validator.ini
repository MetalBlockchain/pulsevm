# Non-producing Leap validator for the handover rehearsal: follows the
# fixture chain over P2P, independently validating every block. Two of these
# plus xpr-producer form the three-node XPR consensus of the rehearsal.
plugin = eosio::chain_api_plugin
plugin = eosio::net_plugin

http-server-address = 0.0.0.0:8888
p2p-listen-endpoint = 0.0.0.0:9876
p2p-peer-address = xpr-producer:9876
access-control-allow-origin = *
verbose-http-errors = true
