name: Benching at scale

# Whether a 21-equal-weight-validator committee tolerates one silent member,
# where a 5-equal-weight one does not. MetalGo's benching cap is
# (1 - alpha_confidence / k) / 3: with the reported consensus-poll settings
# that is 8.33% at five validators, so a 20%-weight validator can never be
# benched and the other four stall when it goes silent (see
# docs/xpr-cutover-operations.md, "benching"). At 21 it is about 4.76%, just
# above a 21st's own ~4.76% weight. This boots a real 21-node MetalGo+PulseVM
# cluster (no XPR/Leap/migration involved; a plain genesis boot is enough to
# test MetalGo-level consensus liveness), kills one validator, and requires
# every other node to keep advancing.
#
# 21 real node processes is a materially bigger ask than the 5-node cutover
# rehearsal, so this does not run on every push/PR: schedule and
# workflow_dispatch only.

on:
  schedule:
    # Weekly, offset from resilience.yml's Monday 05:41 UTC cron so the two
    # heavy jobs do not compete for the same runner pool.
    - cron: '23 7 * * 3'
  workflow_dispatch:

env:
  METALGO_VERSION: v1.14.2-tahoe
  RUNNER_COMMIT: 869d8a0cd62dac3a0fd1c503a36bdd6dfabda025

permissions:
  contents: read

jobs:
  benching-scale:
    name: benching-scale-linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
      PULSEVM_NODE_COUNT: '21'
      PULSEVM_BENCHING_VICTIM_PATTERN: 'node21/configs'

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Configure LLVM APT repository
        run: wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key|sudo apt-key add - && sudo echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-13 cmake zlib1g-dev pkg-config llvm-22-dev libpolly-22-dev python3 jq curl

      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install Protobuf (protoc)
        uses: ./.github/actions/setup-protoc
        with:
          version: '27.1'

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-amd64-benching-scale-${{ hashFiles('**/Cargo.lock') }}

      - name: Check out metalgo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MetalBlockchain/metalgo
          ref: ${{ env.METALGO_VERSION }}
          path: metalgo

      - name: Build metalgo
        working-directory: metalgo
        run: ./scripts/build.sh

      - name: Check out metal-network-runner
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: MetalBlockchain/metal-network-runner
          ref: ${{ env.RUNNER_COMMIT }}
          path: metal-network-runner

      - name: Patch and build metal-network-runner
        working-directory: metal-network-runner
        run: |
          git apply "$GITHUB_WORKSPACE/docker/handover/patches/metal-network-runner-startup-timeout.patch"
          ./scripts/build.sh

      - name: Boot a 21-node PulseVM cluster
        env:
          METALGO_EXEC_PATH: ${{ github.workspace }}/metalgo/build/metalgo
          METAL_NETWORK_RUNNER_PATH: ${{ github.workspace }}/metal-network-runner/bin/metal-network-runner
        run: |
          set -o pipefail
          ./scripts/run-local.sh 2>&1 | tee "$RUNNER_TEMP/boot.log" &
          BOOT_PID=$!
          # run-local.sh keeps the cluster up after its own convergence check
          # passes (it does not exit); wait for that line rather than the
          # process, which only exits when this job kills it below.
          for _ in $(seq 1 180); do
            grep -q "live replay passed" "$RUNNER_TEMP/boot.log" && break
            kill -0 "$BOOT_PID" 2>/dev/null || { echo "boot exited early"; cat "$RUNNER_TEMP/boot.log"; exit 1; }
            sleep 5
          done
          grep -q "live replay passed" "$RUNNER_TEMP/boot.log" || { echo "21-node cluster never converged"; cat "$RUNNER_TEMP/boot.log"; exit 1; }
          echo "$BOOT_PID" > "$RUNNER_TEMP/boot.pid"

      - name: Kill one validator and require the other 20 to keep advancing
        env:
          METAL_NETWORK_RUNNER_PATH: ${{ github.workspace }}/metal-network-runner/bin/metal-network-runner
        run: ./scripts/verify-benching-at-scale.sh 2>&1 | tee "$RUNNER_TEMP/benching.log"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/evidence/" 2>/dev/null || true
          find /tmp -maxdepth 4 -path '*node*/logs/*.log' -exec sh -c 'cp "$1" "$2/$(echo "$1" | tr / _)"' _ {} "$RUNNER_TEMP/evidence" \; 2>/dev/null || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benching-scale-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: warn

      - name: Stop the cluster
        if: always()
        run: |
          [[ -f "$RUNNER_TEMP/boot.pid" ]] && kill "$(cat "$RUNNER_TEMP/boot.pid")" 2>/dev/null || true
          pkill -9 -f metal-network-runner || true
          pkill -9 -f metalgo || true
