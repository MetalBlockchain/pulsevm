name: Build release artifacts

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Build against the oldest supported userspace. The host runner may be
    # newer, but release binaries must remain loadable on Ubuntu 22.04
    # (glibc 2.35).
    container: ubuntu:22.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            gcc-12 \
            g++-12 \
            git \
            gnupg \
            unzip \
            wget
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update
          apt-get install -y \
            binutils \
            build-essential \
            cmake \
            libpolly-22-dev \
            libssl-dev \
            libzstd-dev \
            llvm-22-dev \
            pkg-config \
            zlib1g-dev \
            zstd

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protobuf (protoc)
        uses: ./.github/actions/setup-protoc
        with:
          version: '27.1'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-jammy-llvm22-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release artifact
        env:
          CC: gcc-12
          CXX: g++-12
          LLVM_SYS_221_PREFIX: /usr/lib/llvm-22
        run: cargo build --release --locked

      - name: Verify glibc compatibility
        run: |
          scripts/check-glibc-compat.sh 2.35 \
            target/release/pulsevm \
            target/release/pulse \
            target/release/pulse-keosd

      - name: Upload pulsevm artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulsevm-linux-${{ matrix.arch }}
          path: target/release/pulsevm

      - name: Upload pulse-cli artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-cli-linux-${{ matrix.arch }}
          path: target/release/pulse

      - name: Upload pulse-keosd artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-keosd-linux-${{ matrix.arch }}
          path: target/release/pulse-keosd

  release:
    name: Create draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            chmod +x "$dir"*
            tar -czf "${name}.tar.gz" -C "$dir" .
          done

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*.tar.gz
